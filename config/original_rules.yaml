# Reverse SPES 원문 매매규칙
# 강의자료 기준 - 임의 보정 금지

strategy:
  name: "Reverse SPES Original"

rs20:
  fibonacci:
    first_touch_line: 38
    m_indicator_min: 200
    m_indicator_ratio_min: 0.20

rs3:
  buy_conditions:
    - "세력 / 수급세력주"
    - "시가 대비 상승률 20% 이상"
    - "거래대금 최소 500억 이상"
    - "오후 2시 30분 이후"

  exclusion_conditions:
    - "신규상장 종목"
    - "오후 2시 30분 이전에 50선을 이미 한번이라도 터치한 종목"
    - "50선 근처까지 왔다가 크게 반등 나온 종목"
    - "투상 이상 제외"
    - "당일 단기과열 발동 종목"

  stop_loss:
    - "당일 피보나치 70선 터치"
    - "2일 안에 반등 안 나오면 기간 손절"

  profit_target:
    rate: 0.04
